<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <defs>
    <linearGradient id="yojna-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="yojna-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Kanban / Planning Column Blocks -->
  <g filter="url(#glow)">
    <rect x="4" y="6" width="12" height="28" rx="4" fill="url(#yojna-grad)" />
    <rect x="18" y="13" width="12" height="21" rx="4" fill="url(#yojna-accent)" />
    <rect x="18" y="6" width="12" height="5" rx="2.5" fill="url(#yojna-grad)" />
  </g>
  
  <!-- Brand Name -->
  <text x="38" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="0.08em" fill="#ffffff">
    YOJNA
  </text>
</svg>
